<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 360px;
    min-height: 200px;
    background: #1e1e2e;
    color: #cdd6f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
  }

  .topbar {
    background: #181825;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #313244;
  }
  .topbar img { width: 20px; height: 20px; }
  .topbar .title { font-weight: 700; font-size: 14px; color: #cba6f7; }
  .topbar .url {
    flex: 1;
    font-size: 11px; color: #6c7086;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin: 0 8px;
  }
  #lang-toggle {
    background: #313244; color: #cdd6f4;
    border: 1px solid #45475a; border-radius: 4px;
    padding: 2px 7px; font-size: 11px; cursor: pointer;
    flex-shrink: 0;
  }
  #lang-toggle:hover { background: #45475a; }

  .grade-section {
    display: flex; align-items: center;
    padding: 12px 14px; gap: 14px;
    background: #11111b; border-bottom: 1px solid #313244;
  }
  .grade-box {
    font-size: 42px; font-weight: 900;
    line-height: 1; min-width: 50px; text-align: center;
  }
  .grade-info { flex: 1; }
  .grade-score { font-size: 18px; font-weight: 700; }
  .grade-summary { font-size: 11px; color: #a6adc8; margin-top: 2px; }

  .server-tabs {
    display: flex; gap: 4px;
    padding: 8px 14px 0;
    background: #181825; border-bottom: 1px solid #313244;
  }
  .server-tab {
    padding: 4px 10px;
    border: 1px solid #313244; border-bottom: none;
    background: #1e1e2e; color: #6c7086;
    font-size: 11px; border-radius: 4px 4px 0 0; cursor: pointer;
  }
  .server-tab.active { background: #313244; color: #cdd6f4; border-color: #45475a; }

  .action-bar {
    padding: 6px 14px; background: #181825;
    border-bottom: 1px solid #313244;
    display: flex; justify-content: flex-end;
  }
  #copy-all {
    background: #313244; color: #cdd6f4;
    border: 1px solid #45475a; border-radius: 4px;
    padding: 3px 10px; font-size: 11px; cursor: pointer;
  }
  #copy-all:hover { background: #45475a; }

  #list {
    padding: 10px 14px;
    max-height: 300px; overflow-y: auto;
  }
  #list::-webkit-scrollbar { width: 4px; }
  #list::-webkit-scrollbar-track { background: transparent; }
  #list::-webkit-scrollbar-thumb { background: #313244; border-radius: 2px; }

  .footer {
    padding: 6px 14px;
    border-top: 1px solid #313244; background: #11111b;
    font-size: 10px; color: #45475a; text-align: center;
  }

  .lang-btn { display: none; }
</style>
</head>
<body>

<div class="topbar">
  <img src="icons/icon16.png" alt="">
  <span class="title">HeaderShield</span>
  <span class="url" id="url">—</span>
  <button id="lang-toggle" class="lang-btn active">EN</button>
</div>

<div class="grade-section">
  <div class="grade-box" id="grade" style="color:#6c7086;">—</div>
  <div class="grade-info">
    <div class="grade-score" id="score" style="color:#6c7086;">—/100</div>
    <div class="grade-summary" id="summary">—</div>
  </div>
</div>

<div class="server-tabs">
  <button class="server-tab active" data-server="nginx">nginx</button>
  <button class="server-tab" data-server="apache">Apache</button>
  <button class="server-tab" data-server="caddy">Caddy</button>
</div>

<div class="action-bar">
  <button id="copy-all">Copy all fixes</button>
</div>

<div id="list">
  <div style="color:#6c7086;text-align:center;padding:20px;font-size:12px;">—</div>
</div>

<div class="footer" id="footer">Local only · Zero telemetry · Data never leaves your browser</div>

<script src="i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
